# Configurações customizadas da aplicação (namespace próprio 'app' para evitar conflitos com propriedades do Spring).
app:
  ai:
    # Provedor utilizado como fallback quando o cliente não informa o campo 'provider' na requisição.
    # Valor 'ollama' permite rodar localmente sem precisar de chave paga por padrão.
    default-provider: ollama

    # Instrução de sistema (system prompt) enviada a todos os modelos para padronizar tom, clareza e idioma das respostas.
    system-prompt: "Você é um assistente técnico objetivo, claro e direto. Responda em português."

    # Quantidade máxima de mensagens retidas na janela de memória por conversa (MessageWindowChatMemory).
    # Valor 20 equilibra manutenção de contexto sem estourar o limite de tokens/custo dos modelos.
    memory-max-messages: 20

# Configurações oficiais do ecossistema Spring e Spring AI.
spring:
  ai:
    # Configurações do provedor OpenAI.
    openai:
      # Chave da API lida da variável de ambiente OPENAI_API_KEY; valor padrão vazio evita falha se o provedor não for usado.
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          # Modelo padrão da OpenAI: 'gpt-4o-mini' oferece bom equilíbrio entre velocidade, custo e qualidade.
          model: gpt-4o-mini
          # Controla a criatividade/aleatoriedade da resposta (0.0 = determinístico, 1.0+ = mais criativo); 0.7 é um ponto equilibrado.
          temperature: 0.7

    # Configurações do provedor Google Gemini (GenAI).
    google:
      genai:
        # Chave da API lida da variável de ambiente GEMINI_API_KEY; valor padrão vazio evita erro ao iniciar sem a chave configurada.
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            # Modelo padrão do Google Gemini: 'gemini-2.5-flash' é otimizado para baixa latência em streaming.
            model: gemini-2.5-flash
            # Temperatura 0.7 para respostas naturais mantendo consistência técnica.
            temperature: 0.7

    # Configurações do provedor Ollama (execução local de LLMs).
    ollama:
      # URL base do servidor Ollama lida de OLLAMA_BASE_URL; fallback 'http://localhost:11434' é a porta padrão do Ollama local.
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          # Modelo local padrão no Ollama: 'llama3.2' é leve o suficiente para rodar em máquinas de desenvolvimento.
          model: llama3.2
          # Temperatura 0.7 alinhada aos demais provedores para comportamento consistente.
          temperature: 0.7
